name: Standalone MCP runtime

on:
  pull_request:
  push:
    branches:
      - main
      - "working/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate standalone bridge
        run: npm run check

      - name: Commit generated lock on working branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/working/')
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh standalone MCP runtime lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
