name: Standalone MCP runtime

on:
  pull_request:
  push:
    branches:
      - main
      - "working/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate standalone bridge with real Strands MCP integration
        run: npm run check:real
